name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ALLURE_VERSION: 2.35.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install Allure CLI
        run: |
          mkdir -p ${{github.workspace}}/allure-cli
          curl -sSL "https://repo.maven.apache.org/content/repositories/releases/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.zip" -o ${{github.workspace}}/allure-cli/allure.zip
          unzip -q ${{github.workspace}}/allure-cli/allure.zip -d ${{github.workspace}}/allure-cli
          echo "${{github.workspace}}/allure-cli/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH

      - name: Run lint
        run: npm run lint
      - name: Run type check
        run: npm run typecheck
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Generate Allure Report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  pages:
    needs: test
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      - name: Download Allure Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
